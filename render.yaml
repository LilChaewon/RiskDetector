services:
  - type: web
    name: riskdetector-frontend
    runtime: docker
    dockerfilePath: ./frontend/riskdetector-web/Dockerfile
    dockerContext: ./frontend/riskdetector-web
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_MOCK_MODE
        value: "false"
